<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGP WOOD PRO v2.0</title>
    
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Estilos principales -->
    <link rel="stylesheet" href="css/styles.css">
    
    <style>
        /* Scrollbar personalizado */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Animaciones */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out;
        }

        /* Mejoras visuales */
        #drawer-nombre:focus {
            outline: none;
            background: #fffbeb;
        }
        #btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }
        .drawer-overlay {
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="flex overflow-hidden bg-slate-100">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="p-6 text-xl font-black text-amber-500 border-b border-slate-800">
            WOOD PRO <span class="text-xs text-slate-400">v2.0</span>
        </div>
        
        <nav class="mt-6">
            <div class="nav-item active" data-view="kanban">📋 Tablero Taller</div>
            <div class="nav-item" data-view="dashboard">📊 Dashboard</div>
            <div class="nav-item" data-view="cotizador">💰 Cotizador</div>
            <div class="nav-item" data-view="inventario">🌲 Inventario</div>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content flex flex-col flex-1">
        
        <!-- TOP BAR (Buscador + Filtros) -->
        <div class="px-8 py-4 bg-white border-b flex items-center gap-6 shadow-sm">
            
            <!-- Buscador -->
            <div class="relative w-full max-w-md">
                <input type="text" 
                       id="globalSearch" 
                       placeholder="Buscar cliente o pedido..." 
                       class="w-full bg-slate-100 border-none rounded-full py-2 px-4 text-sm 
                              focus:ring-2 focus:ring-amber-500 transition-all">
            </div>

            <!-- Filtros -->
            <div class="flex gap-2 items-center border-l pl-6 border-slate-200">
                <button class="filter-btn active" id="btn-all">Todos</button>
                <button class="filter-btn" id="btn-p-high">🔥 Urgentes</button>
                <button class="filter-btn" id="btn-bloqueado">⚠️ Bloqueados</button>
                <button class="filter-btn" id="btn-atrasado">⏰ Atrasados</button>
            </div>
        </div>

        <!-- TABLERO KANBAN -->
        <div id="board" class="kanban-board flex-1 overflow-x-auto p-8">
            <!-- Las columnas se generan dinámicamente -->
        </div>
    </main>

    <!-- DRAWER OVERLAY -->
    <div id="drawerOverlay" class="drawer-overlay"></div>
    
    <!-- DRAWER (Panel Lateral) -->
    <div id="orderDrawer" class="order-drawer shadow-2xl"></div>

    <!-- Scripts - Módulos ES6 -->
    <script type="module" src="src/app.js"></script>
</body>
</html>
